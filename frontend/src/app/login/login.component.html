<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">🅿</span>
    </div>
    <h1>{{ registering ? 'Create a staff account' : 'Staff sign in' }}</h1>
    <p class="subtitle">{{ registering ? 'Request access to a parking area after signing up.' : 'Parking Management System' }}</p>

    <form (ngSubmit)="submit()">
      @if (registering) {
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" [(ngModel)]="name" autocomplete="name" maxlength="100" [disabled]="loading" />
        </div>
      }
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="username"
          maxlength="255"
          [disabled]="loading"
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Password"
          [autocomplete]="registering ? 'new-password' : 'current-password'"
          [disabled]="loading"
        />
      </div>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <button type="submit" [disabled]="loading" class="login-btn">
        {{ loading ? 'Please wait…' : registering ? 'Create account' : 'Sign in' }}
      </button>
    </form>

    <button type="button" class="mode-btn" (click)="toggleRegistration()" [disabled]="loading">
      {{ registering ? 'Back to sign in' : 'Create an account to request access' }}
    </button>
  </div>
</div>
